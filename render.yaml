services:
  - type: web
    name: pro-rag-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pro-rag-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: MIN_RERANK_SCORE
        value: "0.15"

  - type: web
    name: pro-rag-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: PORT
        value: "5173"

databases:
  - name: pro-rag-db
    databaseName: rag
    user: rag
    plan: starter
