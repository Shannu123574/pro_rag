services:
  - type: web
    name: pro-rag-api
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pro-rag-db
          property: internalConnectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: MIN_RERANK_SCORE
        value: 0.15

  - type: web
    name: pro-rag-frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    plan: starter
    envVars:
      - key: VITE_API_URL
        value: https://pro-rag-api.onrender.com

databases:
  - name: pro-rag-db
    databaseName: rag
    user: rag
    plan: starter
